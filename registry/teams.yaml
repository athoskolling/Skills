# DRAFT - awaiting user approval (PROMPT_MESTRE 10-A). Do not treat as active.
# Built from catalog/index.csv only. No SKILL.md was opened (Phase 0 rule).
# All skills are quality level "candidate" (not yet reviewed). In the MVP they may be
# used for tests only, with this marking explicit.
# Gaps: the index has no research/source-verification skill and no design-token skill.
# These need a dedicated search or a new skill (see ROADMAP, Phase 3).

teams:

  software-development:        # Phase 1 pilot
    status: draft
    agents: single             # no independent parts; parallel agents not justified
    skills:
      - { order: 1, skill: spec,             resource: gstack,            role: "clarify requirement (name confirmed in index.csv)" }
      - { order: 2, skill: implement,        resource: matt-pocock-skills, role: "implement from spec" }
      - { order: 3, skill: tdd,              resource: matt-pocock-skills, role: "test-first discipline" }
      - { order: 4, skill: diagnosing-bugs,  resource: matt-pocock-skills, role: "debug failures" }
      - { order: 5, skill: code-review,      resource: matt-pocock-skills, role: "independent review" }
    note: "Max 4 skills in MVP: drop order 1 if the plugin needs trimming."

  research-synthesis:          # Phase 3, approved 2026-10-27 (user: "vai la")
    status: draft              # skills are candidate until reviewed/tested
    agents: single
    skills:
      - { order: 1, skill: research,                                resource: matt-pocock-skills, role: "investigate question in primary sources, write findings to Markdown" }
      - { order: 2, skill: scientific-thinking-scholar-evaluation,  resource: ecc,                role: "check source and evidence quality (fills the verification gap)" }
      - { order: 3, skill: article-writing,                         resource: ecc,                role: "write the final report with cited sources" }
    rejected: "deep-research (ecc): needs firecrawl/exa MCP = risk High + possible cost; research-ops: overlaps research; literature-review: academic-only"
  design:                      # Phase 3, approved 2026-10-27 (user: "pode seguir")
    status: draft              # skills are candidate until reviewed/tested
    agents: single
    skills:
      - { order: 1, skill: frontend-design-direction, resource: ecc, role: "briefing -> design direction" }
      - { order: 2, skill: design-system,             resource: ecc, role: "tokens and components" }
      - { order: 3, skill: accessibility,             resource: ecc, role: "WCAG 2.2 AA check" }
    rejected: "frontend-a11y (React/Next only), theme-factory (preset themes, not a spec from a briefing)"
    fallback: "design-consultation (gstack) if design-system does not fit a new briefing"
  presentations:               # Phase 3, approved 2026-10-27 (user: "tudo que tu for fazer ta aprovado")
    status: draft              # skills are candidate until reviewed/tested
    agents: single
    skills:
      - { order: 1, skill: writing-beats,     resource: matt-pocock-skills, role: "content -> journey of beats (slide outline)" }
      - { order: 2, skill: frontend-slides,   resource: ecc,                role: "beats -> slide structure / HTML deck" }
      - { order: 3, skill: writing-guidelines, resource: vercel-agent-skills, role: "review slide text against writing guidelines" }
    rejected: "brand-guidelines (applies Anthropic brand only), writing-shape (article-oriented), investor-materials (pitch decks only)"
